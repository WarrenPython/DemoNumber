<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ผลลัพธ์รหัสโชคดีประจำตัว</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Cinzel+Decorative:wght@700;900&family=Noto+Serif+Thai:wght@300;400;600;700&display=swap');

:root{
  --bg-void:#150a08;
  --bg-maroon:#2b0f10;
  --bg-maroon-2:#3a1414;
  --gold:#c9a227;
  --gold-light:#e8c766;
  --gold-dim:#8a6a1f;
  --cream:#efe3c8;
  --cream-dim:#c9b998;
  --shadow-deep: 0 20px 60px rgba(0,0,0,.6);
  --radius-amulet: 18px;
}
*{box-sizing:border-box;}
html,body{
  margin:0;padding:0;min-height:100%;
  background:
    radial-gradient(ellipse at 50% -10%, rgba(201,162,39,.10), transparent 55%),
    radial-gradient(ellipse at 50% 110%, rgba(122,31,31,.25), transparent 60%),
    var(--bg-void);
  color:var(--cream);
  font-family:'Noto Serif Thai','Cinzel',serif;
  -webkit-font-smoothing:antialiased;
}
.page{min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:48px 20px 80px;}
.eyebrow{font-family:'Cinzel',serif;letter-spacing:.35em;text-transform:uppercase;font-size:12px;color:var(--gold-dim);margin-bottom:10px;}
h1.title{font-family:'Noto Serif Thai','Cinzel Decorative',serif;font-weight:700;font-size:clamp(28px,5vw,44px);text-align:center;color:var(--gold-light);text-shadow:0 0 24px rgba(201,162,39,.35), 0 2px 0 rgba(0,0,0,.4);margin:0 0 6px;}
p.subtitle{text-align:center;color:var(--cream-dim);font-size:15px;max-width:520px;line-height:1.8;margin:0 0 40px;}
.amulet{position:relative;background:linear-gradient(180deg, var(--bg-maroon), var(--bg-maroon-2));border:1px solid var(--gold-dim);border-radius:var(--radius-amulet);box-shadow:var(--shadow-deep), inset 0 0 40px rgba(201,162,39,.05);padding:40px;width:100%;max-width:640px;}
.amulet::before{content:"";position:absolute;inset:8px;border:1px solid rgba(201,162,39,.35);border-radius:calc(var(--radius-amulet) - 6px);pointer-events:none;}
.amulet::after{content:"";position:absolute;top:-1px;left:50%;transform:translateX(-50%);width:60%;height:1px;background:linear-gradient(90deg, transparent, var(--gold), transparent);}
.divider{display:flex;align-items:center;gap:14px;width:100%;max-width:520px;margin:34px auto 26px;color:var(--gold-dim);}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:linear-gradient(90deg, transparent, var(--gold-dim), transparent);}
.divider span{font-family:'Cinzel',serif;font-size:12px;letter-spacing:.3em;}
.circles-wrap{display:flex;flex-wrap:wrap;justify-content:center;gap:22px 16px;}
.circle-group{display:flex;gap:10px;}
.lucky-circle{width:64px;height:64px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;border:1.5px solid var(--gold);background:radial-gradient(circle at 35% 30%, rgba(201,162,39,.25), rgba(0,0,0,.2) 70%);box-shadow:0 0 18px rgba(201,162,39,.18), inset 0 0 12px rgba(201,162,39,.12);}
.lucky-circle .num{font-family:'Cinzel Decorative',serif;font-weight:700;font-size:22px;color:var(--gold-light);}
.back-link{display:inline-block;margin-top:34px;color:var(--gold-dim);font-family:'Cinzel',serif;font-size:12px;letter-spacing:.2em;text-transform:uppercase;text-decoration:none;border-bottom:1px solid transparent;}
.back-link:hover{color:var(--gold-light);border-color:var(--gold-dim);}
@media (max-width:480px){.amulet{padding:26px 18px;}.lucky-circle{width:54px;height:54px;}.lucky-circle .num{font-size:18px;}}
</style>
</head>
<body>
<div class="page">

  <div class="eyebrow">ผลการคำนวณ</div>
  <h1 class="title">รหัสโชคดีประจำตัวของท่าน</h1>
  <p class="subtitle" id="birthSummary"></p>

  <div class="amulet" id="resultPanel">
    <div class="divider"><span>รหัสโชคดี</span></div>
    <div class="circles-wrap">
      <div class="circle-group" id="grpABC"></div>
      <div class="circle-group" id="grpDEF"></div>
      <div class="circle-group" id="grpGHI"></div>
    </div>
  </div>

  <a href="index.html" class="back-link">← คำนวณใหม่อีกครั้ง</a>

</div>

<script>
  var ZODIAC_TH = ["ชวด","ฉลู","ขาล","เถาะ","มะโรง","มะเส็ง","มะเมีย","มะแม","วอก","ระกา","จอ","กุน"];
  var DAY_TH = ["อาทิตย์","จันทร์","อังคาร","พุธ","พฤหัสบดี","ศุกร์","เสาร์"];
  var MONTH_TH = ["มกราคม","กุมภาพันธ์","มีนาคม","เมษายน","พฤษภาคม","มิถุนายน","กรกฎาคม","สิงหาคม","กันยายน","ตุลาคม","พฤศจิกายน","ธันวาคม"];

  function nextCyc(x){ return x === 7 ? 1 : x + 1; }
  function buildRow(seed){
    var row = [seed];
    for (var i = 1; i < 7; i++) row.push(nextCyc(row[i - 1]));
    return row;
  }

  function calculateLuckyCode(dow, month, zodiacPos){
    var box1Seed = dow;
    var box8Seed = ((month - 1) % 7) + 1;
    var box15Seed = ((zodiacPos - 1) % 7) + 1;

    var rowDay = buildRow(box1Seed);
    var rowMonth = buildRow(box8Seed);
    var rowYear = buildRow(box15Seed);

    var A = rowDay[0], B = rowMonth[0], C = rowYear[0];
    var D = rowMonth[0], posD = rowDay.indexOf(D) + 1, E = rowMonth[posD - 1], F = rowYear[posD - 1];
    var G = rowYear[0], posG = rowDay.indexOf(G) + 1, H = rowMonth[posG - 1], I = rowYear[posG - 1];

    return {
      meta: { dayTh: DAY_TH[dow - 1], monthTh: MONTH_TH[month - 1], zodiacTh: ZODIAC_TH[zodiacPos - 1] },
      rowDay: rowDay, rowMonth: rowMonth, rowYear: rowYear,
      circles: { A:A, B:B, C:C, D:D, E:E, F:F, G:G, H:H, I:I }
    };
  }

  var params = new URLSearchParams(window.location.search);
  var pDay = parseInt(params.get('d'), 10);
  var pMonth = parseInt(params.get('m'), 10);
  var pZodiac = parseInt(params.get('z'), 10);

  if (!pDay || !pMonth || !pZodiac){
    window.location.href = 'index.html';
  } else {
    var result = calculateLuckyCode(pDay, pMonth, pZodiac);

    document.getElementById('birthSummary').textContent =
      "เกิดวัน" + result.meta.dayTh + " เดือน" + result.meta.monthTh + " · ปีนักษัตร" + result.meta.zodiacTh;

    function renderCircleGroup(containerId, letters){
      var el = document.getElementById(containerId);
      el.innerHTML = "";
      letters.forEach(function(letter){
        var c = document.createElement('div');
        c.className = 'lucky-circle';
        c.innerHTML = '<span class="num">' + result.circles[letter] + '</span>';
        el.appendChild(c);
      });
    }
    renderCircleGroup('grpABC', ['A','B','C']);
    renderCircleGroup('grpDEF', ['D','E','F']);
    renderCircleGroup('grpGHI', ['G','H','I']);
  }
</script>
</body>
</html>
